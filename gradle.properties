org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 某些环境下 Gradle 的原生文件监视会报 "Couldn't open current thread"，
# 直接关掉，省得它把构建拖死。
org.gradle.vfs.watch=false

# 需要代理时请在 ~/.gradle/gradle.properties 或系统环境变量里配置，
# 不要写死进仓库 —— 否则没有代理的机器会连死代理，构建全线失败。
systemProp.http.nonProxyHosts=localhost|[::1]

# 26.1 起官方不再混淆，Fabric 也不再维护 yarn / intermediary 映射：
# 这里没有 yarn_mappings，build.gradle 里也没有 mappings 依赖。
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.161.0+26.2
loom_version=1.17.20

modmenu_version=20.0.3

mod_version=0.1.0+26.2
maven_group=com.quickswitchassist
archives_base_name=quickswitch-assist
